name: parity

# Model parity against the Python reference (TorchSharp, all three checkpoints). Downloads ~2.5 GB of
# weights, so it runs nightly and on demand rather than on every push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NLAYA_PARITY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ hashFiles('tools/fixtures/LAYA_COMMIT') }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false # only used to run the hf CLI

      - name: Download checkpoints
        run: |
          uvx --from huggingface_hub hf download convaiinnovations/laya
          uvx --from huggingface_hub hf download convaiinnovations/laya-multilingual

      - run: dotnet build NLaya.slnx -c Release

      - run: dotnet test --project tests/NLaya.Tests -c Release --no-build

      - run: dotnet test --project tests/NLaya.Parity -c Release --no-build
